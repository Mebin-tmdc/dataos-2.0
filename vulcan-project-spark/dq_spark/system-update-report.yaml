kind: dq
name: system_update_report_dq
depends_on: s3depot.device_08.system_update_report

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "System update report table must have at least one row"

  - missing_count(installation_status) = 0:
      name: no_missing_installation_status
      dimension: completeness
      description: "Every report must have an installation status"

  - duplicate_count(_id) = 0:
      name: unique_report_ids
      dimension: uniqueness
      description: "System update report IDs must be unique"

  - failed rows:
      name: valid_installation_status
      dimension: validity
      fail query: |
        SELECT * FROM s3depot.device_08.system_update_report
        WHERE installation_status NOT IN ('DEPLOYED', 'FAILED', 'PENDING', 'BLOCKED', 'IN_PROGRESS')
          AND installation_status IS NOT NULL
      description: "Installation status must be from the valid set"
