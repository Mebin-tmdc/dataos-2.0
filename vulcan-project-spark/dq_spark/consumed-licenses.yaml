kind: dq
name: consumed_licenses_dq
depends_on: s3depot.demolake04.consumed_licenses

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "Consumed licenses table must have at least one row"

  - missing_count(status) = 0:
      name: no_missing_status
      dimension: completeness
      description: "Every license record must have a status"

  - duplicate_count(_id) = 0:
      name: unique_license_ids
      dimension: uniqueness
      description: "License record IDs must be unique"

  - failed rows:
      name: valid_status
      dimension: validity
      fail query: |
        SELECT * FROM s3depot.demolake04.consumed_licenses
        WHERE status NOT IN ('ASSIGNED', 'NEW', 'UNASSIGNED', 'EXPIRED')
          AND status IS NOT NULL
      description: "License status must be from the valid set"
