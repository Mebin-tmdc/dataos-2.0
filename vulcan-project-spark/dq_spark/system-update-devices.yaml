kind: dq
name: system_update_devices_dq
depends_on: s3depot.demolake04.system_update_devices

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "System update devices table must have at least one row"

  - missing_count(installation_status) = 0:
      name: no_missing_installation_status
      dimension: completeness
      description: "Every record must have an installation status"

  - duplicate_count(uuid) = 0:
      name: unique_uuids
      dimension: uniqueness
      description: "System update device record UUIDs must be unique"

  - failed rows:
      name: valid_package_severity
      dimension: validity
      fail query: |
        SELECT * FROM s3depot.demolake04.system_update_devices
        WHERE package_severity NOT IN ('CRITICAL', 'RECOMMENDED', 'OPTIONAL')
          AND package_severity IS NOT NULL
      description: "Package severity must be CRITICAL, RECOMMENDED, or OPTIONAL"
