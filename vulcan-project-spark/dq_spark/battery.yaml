kind: dq
name: battery_dq
depends_on: s3depot.demolake04.battery

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "Battery table must have at least one row"

  - missing_count(device_id) = 0:
      name: no_missing_device_id
      dimension: completeness
      description: "Every battery record must be linked to a device"

  - duplicate_count(battery_id) = 0:
      name: unique_battery_ids
      dimension: uniqueness
      description: "Battery IDs must be unique"

  - failed rows:
      name: remaining_within_design_capacity
      dimension: validity
      fail query: |
        SELECT * FROM s3depot.demolake04.battery
        WHERE battery_remaining_capacity > battery_design_capacity
          AND battery_design_capacity IS NOT NULL
          AND battery_remaining_capacity IS NOT NULL
      description: "Remaining capacity cannot exceed the design capacity"
