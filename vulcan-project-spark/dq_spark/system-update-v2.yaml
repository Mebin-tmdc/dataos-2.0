kind: dq
name: system_update_v2_dq
depends_on: s3depot.device_08.system_update_v2

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "System update v2 catalog must have at least one row"

  - missing_count(package_severity) = 0:
      name: no_missing_package_severity
      dimension: completeness
      description: "Every update entry must have a severity level"

  - duplicate_count(package_id) = 0:
      name: unique_package_ids
      dimension: uniqueness
      description: "Package IDs must be unique per organization"

  - failed rows:
      name: valid_package_severity
      dimension: validity
      fail query: |
        SELECT * FROM s3depot.device_08.system_update_v2
        WHERE package_severity NOT IN ('CRITICAL', 'RECOMMENDED', 'OPTIONAL')
          AND package_severity IS NOT NULL
      description: "Package severity must be CRITICAL, RECOMMENDED, or OPTIONAL"
