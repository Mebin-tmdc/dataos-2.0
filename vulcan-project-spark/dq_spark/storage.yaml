kind: dq
name: storage_dq
depends_on: s3depot.demolake04.storage

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "Storage table must have at least one row"

  - missing_count(device_id) = 0:
      name: no_missing_device_id
      dimension: completeness
      description: "Every storage record must be linked to a device"

  - duplicate_count(storage_id) = 0:
      name: unique_storage_ids
      dimension: uniqueness
      description: "Storage IDs must be unique"

  - failed rows:
      name: valid_used_percentage
      dimension: validity
      fail query: |
        SELECT * FROM s3depot.demolake04.storage
        WHERE storage_used_percentage < 0
           OR storage_used_percentage > 100
      description: "Storage used percentage must be between 0 and 100"
