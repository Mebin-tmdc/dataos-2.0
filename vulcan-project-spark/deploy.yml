version: v1alpha
type: vulcan
name: devicesadpmeb
tags:
  - spark
  - device-orch-360
spec:
  runAsUser: "prajarathina_lenovocomextrubikdatasolutionsonmicrosoftcom"
  compute: lnv-compute
  engine: spark
  repo:
    url: https://github.com/Mebin-tmdc/dataos-2.0
    syncFlags:
      - "--ref=pari"
      - "--submodules=off"
    baseDir: dataos-2.0/vulcan-project-spark
    secret: sandbox:git-sync
  depots:
    - dataos://s3depot?purpose=rw
  workflow:
    schedule:
      crons:
        - "*/30 * * * *"
      endOn: "2027-01-01T00:00:00-00:00"
      timezone: "Asia/Kolkata"
      concurrencyPolicy: Forbid
    logLevel: INFO
    resource:
      driver:
        coreLimit: "2000m"
        cores: 2
        memory: "4g"
      executor:
        coreLimit: "2000m"
        cores: 2
        memory: "8g"
        instances: 4
    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
    sparkConf:
      spark.driver.memory: "8g"
      spark.driver.cores: "2"
      spark.driver.memoryOverhead: "1g"
      spark.executor.memory: "12g"
      spark.executor.cores: "2"
      spark.executor.memoryOverhead: "1g"
      spark.sql.shuffle.partitions: "200"
      spark.sql.adaptive.enabled: "true"
      spark.sql.adaptive.coalescePartitions.enabled: "true"
      spark.sql.adaptive.skewJoin.enabled: "true"
      spark.sql.files.maxPartitionBytes: "134217728"
      spark.driver.maxResultSize: "2g"
      spark.dynamicAllocation.enabled: "true"
      spark.dynamicAllocation.shuffleTracking.enabled: "true"
      spark.dynamicAllocation.initialExecutors: "2"
      spark.dynamicAllocation.minExecutors: "2"
      spark.dynamicAllocation.maxExecutors: "6"
      spark.memory.fraction: "0.8"
      spark.memory.storageFraction: "0.2"
  api:
    replicas: 2
    logLevel: INFO
    resource:
      request:
        cpu: "200m"
        memory: "512Mi"
      limit:
        cpu: "2000m"
        memory: "2Gi"
    sparkConf:
      spark.driver.memory: "8g"
      spark.driver.cores: "2"
      spark.driver.memoryOverhead: "1g"
      spark.executor.memory: "12g"
      spark.executor.cores: "2"
      spark.executor.memoryOverhead: "1g"
      spark.sql.shuffle.partitions: "200"
      spark.sql.adaptive.enabled: "true"
      spark.sql.adaptive.coalescePartitions.enabled: "true"
      spark.sql.adaptive.skewJoin.enabled: "true"
      spark.sql.files.maxPartitionBytes: "134217728"
      spark.driver.maxResultSize: "2g"
      spark.dynamicAllocation.enabled: "true"
      spark.dynamicAllocation.shuffleTracking.enabled: "true"
      spark.dynamicAllocation.initialExecutors: "2"
      spark.dynamicAllocation.minExecutors: "2"
      spark.dynamicAllocation.maxExecutors: "6"
      spark.memory.fraction: "0.8"
      spark.memory.storageFraction: "0.2"