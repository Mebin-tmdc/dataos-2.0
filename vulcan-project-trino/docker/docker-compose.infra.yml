# Infrastructure: statestore + warehouse Postgres, MinIO, two Iceberg REST catalogs.
# Access:
#   postgresql://vulcan:vulcan@localhost:5431/statestore
#   postgresql://vulcan:vulcan@localhost:5434/warehouse
#   MinIO API          http://localhost:19000  (mapped; in-network still minio:9000)
#   MinIO console      http://localhost:9001
#   Iceberg REST Warehouse  http://localhost:8181
#   Iceberg REST Sample     http://localhost:8182

x-images:
  postgres: &postgres_image "postgres:15-alpine"
  minio: &minio_image "minio/minio:latest"
  minio-mc: &minio_mc_image "minio/mc:latest"
  iceberg-rest: &iceberg_rest_image "tabulario/iceberg-rest:1.6.0"
  

volumes:
  statestore:
    driver: local
  warehouse:
    driver: local
  objectstore:
    driver: local

networks:
  vulcan:
    external: true

services:
  statestore:
    image: *postgres_image
    environment:
      POSTGRES_DB: statestore
      POSTGRES_USER: vulcan
      POSTGRES_PASSWORD: vulcan
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5431:5432"
    volumes:
      - statestore:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulcan -d statestore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vulcan

  warehouse:
    image: *postgres_image
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: vulcan
      POSTGRES_PASSWORD: vulcan
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - warehouse:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulcan -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vulcan

  minio:
    image: *minio_image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      # Host 19000 avoids clashing with other stacks using localhost:9000 (e.g. Portainer, other MinIO).
      - "19000:9000"
      - "9001:9001"
    volumes:
      - objectstore:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vulcan

  minio-init:
    image: *minio_mc_image
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/warehouse --ignore-existing;
      /usr/bin/mc mb myminio/sample --ignore-existing;
      /usr/bin/mc anonymous set download myminio/warehouse;
      /usr/bin/mc anonymous set download myminio/sample;
      exit 0;
      "
    networks:
      - vulcan

  iceberg-rest-warehouse:
    image: *iceberg_rest_image
    environment:
      CATALOG_WAREHOUSE: "s3://warehouse/"
      CATALOG_IO__IMPL: "org.apache.iceberg.aws.s3.S3FileIO"
      CATALOG_S3_ENDPOINT: "http://minio:9000"
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vulcan

  iceberg-rest-sample:
    image: *iceberg_rest_image
    environment:
      CATALOG_WAREHOUSE: "s3://sample/"
      CATALOG_IO__IMPL: "org.apache.iceberg.aws.s3.S3FileIO"
      CATALOG_S3_ENDPOINT: "http://minio:9000"
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    ports:
      - "8182:8181"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vulcan
 