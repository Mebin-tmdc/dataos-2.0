  - name: warranty_response_profile
    description: Warranty response profile attribute for the device warranty semantic model.
    tags:
      - warranty
      - coverage
    terms:
      - device_warranty.warranty_response_profile
      - warranty.warranty_response_profile
  - name: _nilus_load_id
    description: Ingestion load identifier from the source pipeline.
    tags:
      - warranty
      - identifier
      - key
    terms:
      - device_warranty._nilus_load_id
      - identifier._nilus_load_id
  - name: _nilus_id
    description: Ingestion record identifier from the source pipeline.
    tags:
      - warranty
      - identifier
      - key
    terms:
      - device_warranty._nilus_id
      - identifier._nilus_id

measures:
  - name: total_active_warranties
    type: count
    expression: "{device_warranty._id}"
    filters:
      - "{device_warranty.warranty_end} > CURRENT_TIMESTAMP"
    description: Total number of currently active warranties
    ai_context:
      instructions: Headline active coverage count. Break down by warranty_type or device_category for portfolio analysis.
      synonyms:
        - active warranty count
        - live warranties
    tags:
      - warranty
      - active
      - count
    terms:
      - warranty.active_count
      - device_lifecycle.active_warranties

  - name: total_devices_with_expired_warranty
    type: count_distinct
    expression: "{device_warranty.device_id}"
    filters:
      - "{device_warranty.warranty_end} < CURRENT_TIMESTAMP"
    description: Total number of devices with expired warranties
    tags:
      - warranty
      - expired
      - device
    terms:
      - warranty.expired_device_count
      - device_lifecycle.expired_warranty_devices

  - name: total_devices_with_active_warranty
    type: count_distinct
    expression: "{device_warranty.device_id}"
    filters:
      - "{device_warranty.warranty_end} > CURRENT_TIMESTAMP"
    description: Total number of devices with active warranty coverage
    tags:
      - warranty
      - active
      - device
    terms:
      - warranty.active_device_count
      - device_lifecycle.active_warranty_devices

  - name: total_devices_with_soon_expiring_warranty
    type: count_distinct
    expression: "{device_warranty.device_id}"
    filters:
      - "{device_warranty.warranty_end} > CURRENT_TIMESTAMP"
      - "{device_warranty.warranty_end} < DATE_ADD('DAY', 60, CURRENT_TIMESTAMP)"
    description: Total number of devices with warranties expiring within 60 days
    ai_context:
      instructions: Use for proactive warranty renewal workflows. Scope to a device_category for targeted alerts.
      synonyms:
        - near-expiry warranty devices
        - soon expiring covered devices
    tags:
      - warranty
      - expiring_soon
      - device
    terms:
      - warranty.expiring_soon_device_count
      - device_lifecycle.soon_expiring_warranty_devices

  - name: total_expired_warranties
    type: count_distinct
    expression: "{device_warranty.warranty_id}"
    filters:
      - "{device_warranty.warranty_end} < CURRENT_TIMESTAMP"
    description: Total number of expired warranty records
    tags:
      - warranty
      - expired
      - count
    terms:
      - warranty.expired_count
      - device_lifecycle.expired_warranties

  - name: total_expiring_soon_warranties
    type: count_distinct
    expression: "{device_warranty.warranty_id}"
    filters:
      - "{device_warranty.warranty_end} > CURRENT_TIMESTAMP"
      - "{device_warranty.warranty_end} < DATE_ADD('DAY', 60, CURRENT_TIMESTAMP)"
    description: Total number of warranty records expiring within 60 days
    tags:
      - warranty
      - expiring_soon
      - count
    terms:
      - warranty.expiring_soon_count
      - device_lifecycle.soon_expiring_warranties

segments:
  - name: active_warranties
    expression: "{device_warranty.warranty_end} > CURRENT_TIMESTAMP"
    description: Warranty records that are currently active
    ai_context:
      instructions: >
        SQL API: `active_warranties IS TRUE`. REST API: `"segments": ["device_warranty.active_warranties"]`.
        Use as default filter for active coverage dashboards.
      synonyms:
        - live warranties
        - in-coverage warranties
    tags:
      - warranty
      - active
      - status
    terms:
      - warranty.active
      - device_lifecycle.active_coverage

  - name: expired_warranties
    expression: "{device_warranty.warranty_end} < CURRENT_TIMESTAMP"
    description: Warranty records that have expired
    ai_context:
      instructions: >
        SQL API: `expired_warranties IS TRUE`. REST API: `"segments": ["device_warranty.expired_warranties"]`.
      synonyms:
        - out-of-warranty
        - lapsed warranties
    tags:
      - warranty
      - expired
      - status
    terms:
      - warranty.expired
      - device_lifecycle.expired_coverage

  - name: expiring_soon_warranties
    expression: "{device_warranty.warranty_end} > CURRENT_TIMESTAMP AND {device_warranty.warranty_end} < DATE_ADD('DAY', 60, CURRENT_TIMESTAMP)"
    description: Warranties expiring within the next 60 days
    ai_context:
      instructions: >
        SQL API: `expiring_soon_warranties IS TRUE`. REST API: `"segments": ["device_warranty.expiring_soon_warranties"]`.
        Use to drive renewal alerts and service contract reviews.
      synonyms:
        - near-expiry warranties
        - soon lapsing coverage
    tags:
      - warranty
      - expiring_soon
      - temporal
    terms:
      - warranty.expiring_soon
      - device_lifecycle.near_expiry
