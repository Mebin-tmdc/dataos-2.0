# Converted from legacy: semantics/device_warranty.yml (physical model is s3depot.device_sri.device_warranty)
kind: semantic
name: device_warranty
depends_on: s3depot.device_sri.device_warranty
description: Device warranty coverage, expiration, and lifecycle tracking (semantic layer)

ai_context:
  instructions: >
    Warranty coverage dimension. Use for monitoring active, expired, and near-expiry warranties per device.
    Join via devices for fleet-wide warranty health dashboards.
    Member names use semantic_model.member form (e.g. device_warranty.warranty_type).
  synonyms:
    - warranty coverage
    - device warranty
    - service contract
    - warranty lifecycle
dimensions:
  - name: _id
    description: Source record identifier for the semantic model.
    tags:
      - warranty
      - identifier
      - key
    terms:
      - device_warranty._id
      - identifier._id
  - name: org_id
    description: Organization identifier used to scope the record.
    tags:
      - warranty
      - organization
      - identifier
    terms:
      - device_warranty.org_id
      - organization.org_id
  - name: device_id
    description: Business identifier for the associated device.
    tags:
      - warranty
      - device
      - identifier
    terms:
      - device_warranty.device_id
      - device.device_id
  - name: device_name
    description: Device name attribute for the device warranty semantic model.
    tags:
      - warranty
      - device
      - identifier
    terms:
      - device_warranty.device_name
      - device.device_name
  - name: serial_number
    description: Device serial number used for inventory matching.
    tags:
      - warranty
      - device
      - identifier
    terms:
      - device_warranty.serial_number
      - device.serial_number
  - name: device_category
    description: Normalized device category for the covered device
    ai_context:
      instructions: Use to break down warranty metrics by device type (PC, Mobile/Tablet, etc.).
      synonyms:
        - device type
        - covered device category

    tags:
      - warranty
      - classification
      - device
    terms:
      - device_warranty.device_category
      - device.category
  - name: created_at
    description: Timestamp when the record was created.
    tags:
      - warranty
      - temporal
      - created
    terms:
      - device_warranty.created_at
      - temporal.created_at
  - name: last_updated
    description: Last updated attribute for the device warranty semantic model.
    tags:
      - warranty
      - temporal
      - date
    terms:
      - device_warranty.last_updated
      - temporal.last_updated
  - name: warranty_id
    description: Warranty id attribute for the device warranty semantic model.
    tags:
      - warranty
      - identifier
      - key
    terms:
      - device_warranty.warranty_id
      - identifier.warranty_id
  - name: warranty_number
    description: Warranty number attribute for the device warranty semantic model.
    tags:
      - warranty
      - coverage
    terms:
      - device_warranty.warranty_number
      - warranty.warranty_number
  - name: warranty_type
    description: Type of warranty coverage (base, extended, on-site, etc.)
    ai_context:
      instructions: Use to segment warranty analysis by coverage tier (base vs. extended vs. on-site).
      synonyms:
        - coverage type
        - warranty tier
        - service type

    tags:
      - warranty
      - classification
      - coverage
    terms:
      - warranty.type
      - device_lifecycle.warranty_category
  - name: warranty_start
    description: Timestamp when warranty coverage begins
    ai_context:
      instructions: Use as the start of the warranty coverage window for date range analysis.
      synonyms:
        - coverage start
        - warranty begin date

    tags:
      - warranty
      - temporal
      - start
    terms:
      - warranty.start_date
      - device_lifecycle.warranty_start
  - name: warranty_end
    description: Timestamp when warranty coverage ends
    ai_context:
      instructions: Use to identify expiring or expired warranties. Key field for `expiring_soon_warranties` segment.
      synonyms:
        - coverage end
        - warranty expiry
        - warranty expiration date
    tags:
      - warranty
      - temporal
      - end
    terms:
      - warranty.end_date
      - device_lifecycle.warranty_end
  - name: warranty_name
    description: Warranty name attribute for the device warranty semantic model.
    tags:
      - warranty
      - coverage
    terms:
      - device_warranty.warranty_name
      - warranty.warranty_name
  - name: warranty_category
    description: Warranty category attribute for the device warranty semantic model.
    tags:
      - warranty
      - classification
      - category
    terms:
      - device_warranty.warranty_category
      - classification.warranty_category
  - name: warranty_delivery_type
    description: Warranty delivery type attribute for the device warranty semantic model.
    tags:
      - warranty
      - classification
      - type
    terms:
      - device_warranty.warranty_delivery_type
      - classification.warranty_delivery_type
  - name: warranty_description
    description: Warranty description attribute for the device warranty semantic model.
    tags:
      - warranty
